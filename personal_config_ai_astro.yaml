# Supplemental digest for AI/LLM/LMM methods that may be useful in astronomy.
#
# Run with:
#   conda activate arxiv-digest
#   python src/action.py --config personal_config_ai_astro.yaml

topic: "Computer Science"
categories:
  - "Artificial Intelligence"
  - "Computation and Language"
  - "Computer Vision and Pattern Recognition"
  - "Machine Learning"
  - "Information Retrieval"

threshold: 8

output_dir: "outputs/ai-for-astro"
top_k_for_deep_read: 5
min_papers: 5
max_papers: 8
max_tokens_per_paper: 560
provider: "deepseek"
model: "deepseek-chat"

digest_guidance: |
  This digest is for an astronomer who has some basic knowledge of large
  models, but is not a specialist in the newest AI/ML literature.

  For "Short digest", write 5-6 clear sentences instead of a terse 3-sentence
  summary. Explain the core technical idea in plain language, define any
  unavoidable AI jargon briefly, and make the astronomy connection explicit.
  Prefer this structure:
  1. What problem is the paper trying to solve?
  2. What is the main AI/ML idea, in non-specialist language?
  3. Why might this matter for astronomy or JWST/high-redshift work?
  4. What concrete workflow could I imagine trying it on?
  5. What limitation, caveat, or prerequisite should I check before investing
     time in the paper?

  Be selective. It is better to recommend fewer papers with useful, readable
  explanations than many generic AI papers.

interest: |
  I am interested in AI, machine learning, large language models (LLMs), large
  multimodal models (LMMs), foundation models, retrieval-augmented generation,
  research agents, and automated scientific discovery methods that can be
  useful for astronomy and astrophysics.

  Prioritize papers that could help with:
  1. JWST imaging/spectroscopy analysis, especially high-redshift galaxies,
     AGN, and little red dots
  2. astronomical source classification, anomaly detection, morphology,
     deblending, photometric redshifts, SED fitting, spectral fitting, or
     uncertainty estimation
  3. multimodal models that combine images, spectra, catalogs, tables, text, or
     literature
  4. LLM agents for literature review, data analysis, coding, scientific
     workflows, or reproducible research
  5. methods that could transfer to large survey data from JWST, Roman, Euclid,
     Rubin/LSST, HST, ALMA, or multi-wavelength catalogs

  Deprioritize generic NLP, chatbots, robotics, games, social media, medicine,
  finance, or benchmark-only papers unless the method clearly transfers to
  astronomical research workflows.
