# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Daily pipeline 

on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Optional arXiv submission date to digest, in YYYY-MM-DD format'
        required: false
        type: string
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Runs Monday-Friday at 12:00 Beijing time (04:00 UTC).
    - cron: '0 4 * * 1-5'

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  generate_and_send_digest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - config: personal_config.yaml
            artifact: astro-jwst-lrd
          - config: personal_config_ai_astro.yaml
            artifact: ai-for-astro
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    - name: Generate Digest 
      run: |
        if [ -n "${{ inputs.date }}" ]; then
          python src/action.py --config ${{ matrix.config }} --date "${{ inputs.date }}"
        else
          python src/action.py --config ${{ matrix.config }}
        fi
      env:
        DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
        FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
        TO_EMAIL: ${{ secrets.TO_EMAIL }}
        MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
        MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
        MAIL_CONNECTION: ${{ secrets.MAIL_CONNECTION }}
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: arxiv-digest-${{ matrix.artifact }}
        path: |
          digest.html
          outputs/

  deploy_pages:
    needs: generate_and_send_digest
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download digest artifacts
      uses: actions/download-artifact@v4
      with:
        pattern: arxiv-digest-*
        path: new_site
        merge-multiple: false
    - name: Restore existing Pages history
      run: |
        git fetch origin gh-pages || true
        if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
          git worktree add public origin/gh-pages
        else
          mkdir public
        fi
    - name: Merge new digest pages
      run: |
        python - <<'PY'
        import json
        import shutil
        from datetime import datetime, timezone
        from pathlib import Path
        import html

        new_site = Path("new_site")
        public = Path("public")
        public.mkdir(exist_ok=True)

        for digest_json in sorted(new_site.glob("*/outputs/*/digest.json")):
            digest_dir = digest_json.parent
            digest = json.loads(digest_json.read_text(encoding="utf-8"))
            date = digest["generated_on"]
            name = digest_dir.name
            target_dir = public / name
            target_dir.mkdir(parents=True, exist_ok=True)
            for filename in [
                "index.html",
                f"{date}.html",
                "digest.html",
                "digest.md",
                "digest.json",
                "mcp_deep_read_queue.md",
            ]:
                source = digest_dir / filename
                if source.exists():
                    if filename == "index.html":
                        shutil.copy2(source, target_dir / "index.html")
                    elif filename.startswith(date):
                        shutil.copy2(source, target_dir / filename)
                    else:
                        dated_name = f"{date}-{filename}"
                        shutil.copy2(source, target_dir / dated_name)

        links = []
        for digest_dir in sorted(path for path in public.iterdir() if path.is_dir()):
            history = sorted(digest_dir.glob("*.html"), reverse=True)
            dated_pages = [p for p in history if p.name != "index.html"]
            latest = digest_dir / "index.html"
            links.append((digest_dir.name, latest, dated_pages))

        now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M UTC")
        cards = []
        for name, latest, dated_pages in links:
            dates = [page.stem for page in dated_pages]
            dates_json = html.escape(json.dumps(dates))
            latest_date = dates[0] if dates else ""
            min_date = dates[-1] if dates else ""
            latest_link = latest.relative_to(public).as_posix() if latest.exists() else "#"
            date_options = "".join(
                f'<option value="{html.escape(date)}">{html.escape(date)}</option>'
                for date in dates
            )
            cards.append(
                f'<section class="card">'
                f'<h2>{html.escape(name)}</h2>'
                f'<p class="card-copy">Latest available digest: <strong>{html.escape(latest_date or "not generated yet")}</strong></p>'
                f'<div class="actions">'
                f'<a class="button primary" href="{html.escape(latest_link)}">Open latest</a>'
                f'<button class="button" type="button" data-target="{html.escape(name)}">Choose date</button>'
                f'</div>'
                f'<div class="history-panel" id="history-{html.escape(name)}" hidden>'
                f'<label for="date-{html.escape(name)}">Historical digest date</label>'
                f'<input id="date-{html.escape(name)}" type="date" min="{html.escape(min_date)}" max="{html.escape(latest_date)}" value="{html.escape(latest_date)}" data-dates="{dates_json}" data-prefix="{html.escape(name)}">'
                f'<select aria-label="Available dates for {html.escape(name)}">{date_options}</select>'
                f'<p class="hint">Pick a date from the calendar or the available-date menu.</p>'
                f'</div>'
                f'</section>'
            )

        (public / "index.html").write_text(f"""<!doctype html>
        <html lang="en">
        <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>Personal arXiv Digest</title>
          <style>
            body {{ margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f7f7f4; color: #1e2528; }}
            main {{ width: min(900px, calc(100% - 32px)); margin: 56px auto; }}
            h1 {{ margin: 0 0 8px; font-size: 34px; }}
            p {{ color: #5f6b70; }}
            .grid {{ display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px; margin-top: 24px; }}
            .card {{ padding: 20px; border: 1px solid #d9dedb; border-radius: 8px; background: #fff; }}
            .card h2 {{ margin: 0 0 10px; }}
            .card-copy {{ margin: 0 0 16px; }}
            .actions {{ display: flex; flex-wrap: wrap; gap: 10px; }}
            .button {{ display: inline-flex; align-items: center; justify-content: center; min-height: 38px; padding: 8px 12px; border: 1px solid #b9c5c2; border-radius: 6px; background: #fff; color: #096b72; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; }}
            .button.primary {{ background: #096b72; color: #fff; border-color: #096b72; }}
            .history-panel {{ margin-top: 16px; padding-top: 14px; border-top: 1px solid #d9dedb; }}
            label {{ display: block; margin-bottom: 6px; font-size: 13px; font-weight: 700; color: #5f6b70; }}
            input, select {{ width: 100%; min-height: 38px; margin-bottom: 10px; padding: 8px 10px; border: 1px solid #b9c5c2; border-radius: 6px; font: inherit; background: #fff; }}
            .hint {{ margin: 0; font-size: 13px; }}
            a {{ color: #096b72; }}
          </style>
        </head>
        <body>
          <main>
            <h1>Personal arXiv Digest</h1>
            <p>Last generated: {html.escape(now)}</p>
            <div class="grid">{''.join(cards)}</div>
          </main>
          <script>
            document.querySelectorAll('button[data-target]').forEach((button) => {{
              button.addEventListener('click', () => {{
                const panel = document.getElementById('history-' + button.dataset.target);
                panel.hidden = !panel.hidden;
              }});
            }});
            document.querySelectorAll('.history-panel input[type="date"]').forEach((input) => {{
              const select = input.parentElement.querySelector('select');
              const dates = JSON.parse(input.dataset.dates || '[]');
              const go = (value) => {{
                if (!value) return;
                if (!dates.includes(value)) {{
                  alert('No digest was generated for this date.');
                  return;
                }}
                window.location.href = input.dataset.prefix + '/' + value + '.html';
              }};
              input.addEventListener('change', () => go(input.value));
              select.addEventListener('change', () => {{
                input.value = select.value;
                go(select.value);
              }});
            }});
          </script>
        </body>
        </html>""", encoding="utf-8")
        PY
    - name: Publish gh-pages branch
      run: |
        cd public
        if [ ! -e .git ]; then
          git init
        fi
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git checkout -B gh-pages
        git add .
        git commit -m "Update arXiv digest pages" || exit 0
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" || git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        git push --force origin gh-pages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
